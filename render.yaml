# Initial testing uses free API + free Postgres.
# Free Postgres expires after 30 days: upgrade before expiry for ongoing use.
# Cron has a $1/month minimum. Review billing before Apply.
services:
  - type: web
    name: weijie-ai-news-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://weijie-products.weiguanghong123.chatgpt.site
      - key: DATABASE_URL
        fromDatabase:
          name: weijie-ai-news-db
          property: connectionString
  - type: cron
    name: weijie-ai-news-weekly
    runtime: node
    plan: starter
    region: singapore
    schedule: "45 10 5 10 *"
    buildCommand: npm ci --omit=dev
    startCommand: node src/run.mjs --backfill-oct-2026
    envVars:
      - key: X_BEARER_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: weijie-ai-news-db
          property: connectionString
databases:
  - name: weijie-ai-news-db
    plan: free
    region: singapore
    databaseName: ai_news
    user: ai_news
    ipAllowList: []
